version: "3.9"

services:
  backend:
    image: YOUR_DOCKERHUB_USERNAME/portfolio-backend:latest
    container_name: portfolio_backend_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      asar-postgres:
        condition: service_started
    networks:
      - portfolio_network

  asar-postgres:
    image: postgres:17-alpine
    container_name: portfolio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asar_admin
      POSTGRES_PASSWORD: asar_password_2026
      POSTGRES_DB: asar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portfolio_network

  asar-minio:
    image: minio/minio:latest
    container_name: portfolio_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: asar_minio_user
      MINIO_ROOT_PASSWORD: asar_minio_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - portfolio_network

  asar-redis:
    image: redis:7.2-alpine
    container_name: portfolio_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - portfolio_network

networks:
  portfolio_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
